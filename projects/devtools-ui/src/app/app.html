<div class="shell">
  <nav class="shell-nav" aria-label="Views">
    <a routerLink="/packages" routerLinkActive="active">Packages</a>
    <a routerLink="/remotes" routerLinkActive="active">Remotes</a>
    <a routerLink="/import-map" routerLinkActive="active">Import Map</a>
    <a routerLink="/graph" routerLinkActive="active">Graph</a>
    <!-- Pools is conditional: most captures carry no pool tag. -->
    @if (hasPools()) {
      <a routerLink="/pools" routerLinkActive="active">Pools</a>
    }
    <!-- Diagnostics tab hidden until resolution-model Task 10 (canonical
         Diagnostics) lands; the /diagnostics route stays reachable by direct
         URL. Deferral: docs/work/resolution-model/plan.md, "Plan amendment
         (2026-08-23): demo resequencing". -->
    <span class="shell-actions">
      <button
        type="button"
        class="nf-button shell-refresh"
        (click)="refresh()"
        [disabled]="capturing()"
        title="Capture a fresh snapshot of the inspected page"
      >
        Refresh
      </button>
      <button
        type="button"
        class="nf-button shell-export"
        (click)="exporter.exportCurrent()"
        [disabled]="!exporter.canExport()"
        title="Download the current snapshot as a JSON file"
      >
        Export JSON
      </button>
    </span>
  </nav>
  @if (capture(); as capture) {
    <div class="shell-status">
      <a
        class="shell-status-url"
        [href]="capture.pageUrl"
        target="_blank"
        rel="noopener noreferrer"
        [title]="capture.pageUrl"
        >{{ capture.pageUrl }}</a
      >
      <span class="shell-status-date" [title]="capture.capturedAt">{{ capture.capturedDate }}</span>
      @for (extra of shellExtras; track $index) {
        <ng-container *ngComponentOutlet="extra" />
      }
      <nf-capture-status-strip />
    </div>
  }
  <main class="shell-content">
    <router-outlet />
  </main>
</div>
